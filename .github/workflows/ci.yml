name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://campusai:campusai@localhost:5432/campusai?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 150
      - name: Check service responses and migration
        run: |
          curl --fail --silent --show-error http://localhost:5173/ | grep -F '<title>CampusAI'
          curl --fail --silent --show-error http://localhost:3001/health | grep -F '"status":"ok"'
          curl --fail --silent --show-error http://localhost:3001/ready | grep -F '"status":"ready"'
          curl --fail --silent --show-error http://localhost:8002/health | grep -F '"service":"ai"'
          docker compose exec -T db psql -U campusai -d campusai -Atc "SELECT to_regclass('public.institutions')" | grep -x institutions
      - name: Run PostgreSQL and real S3 integration tests
        run: docker compose exec -T api npm run test:integration
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
